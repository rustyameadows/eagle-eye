<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace files</title>
<style>
  * { box-sizing: border-box; }
  :root { color-scheme: light; font-family: system-ui, sans-serif; color: #23332e; background: #f2f3ec; }
  body { margin: 0; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 24px; }
  h1 { font: 500 32px/40px Georgia, serif; letter-spacing: -.6px; margin: 0 0 20px; }
  section { background: white; border: 1px solid #c8cec4; border-radius: 8px; overflow: hidden; }
  header { padding: 14px 16px; border-bottom: 1px solid #d9ded6; background: #fafbf7; }
  .tab { height: 28px; width: fit-content; display: flex; gap: 8px; align-items: center; padding: 0 10px; border-radius: 5px; background: #e2ebdf; color: #263c31; font-size: 13px; font-weight: 600; }
  .folder { width: 16px; height: 12px; transform: translateY(3px); }
  .count { padding: 0 5px; border-radius: 4px; color: #3d5e4c; background: #cdddc9; font: 600 11px/16px system-ui, sans-serif; }
  .row { display: flex; align-items: center; gap: 10px; padding: 0 var(--inset); --inset: 16px; min-height: 40px; font-size: 13px; border-bottom: 1px solid #e8ebe5; }
  .row:last-child { border-bottom: 0; }
  .dot { width: 6px; height: 6px; flex: none; background: #617e66; }
  time { margin-left: auto; color: #58635c; font-size: 12px; }
  @media (max-width: 500px) {
    main { padding: 20px 12px; }
    .row.pinned { padding-left: 22px; }
  }
  html:is([data-pass="tab"], [data-pass="row"], [data-pass="final"]) .folder { transform: none; }
  @media (max-width: 500px) {
    html:is([data-pass="row"], [data-pass="final"]) .row.pinned { padding-left: var(--inset); }
  }
  html[data-pass="final"] .row:last-child { border-bottom: 1px solid transparent; }
</style>
<main>
  <h1>Workspace files</h1>
  <section aria-label="File list">
    <header><div class="tab"><svg class="folder" viewBox="0 0 16 12" aria-hidden="true"><path fill="#365543" d="M0 1h6l2 2h8v9H0z M0 0h5v1H0z"/></svg>All files<span class="count">3</span></div></header>
    <div class="row"><span class="dot"></span>Field notes<time>Nov 21</time></div>
    <div class="row pinned"><span class="dot"></span>Project brief<time>Nov 20</time></div>
    <div class="row"><span class="dot"></span>Reading list<time>Nov 18</time></div>
  </section>
</main>
<script>
  document.documentElement.dataset.pass = new URLSearchParams(location.search).get("pass") || "baseline";
</script>
</html>
