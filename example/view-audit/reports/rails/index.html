<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Eagle Eye · View comparison</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18291f;
      --quiet: #4c5c52;
      --line: #cbd4ca;
      --paper: #f5f6f1;
      --green: #066843;
      --red: #a4313e;
      font-family: Inter, system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
    }
    main {
      max-width: 1184px;
      margin: auto;
      padding: 30px clamp(14px, 4vw, 56px) 52px;
    }
    header {
      border-bottom: 1px solid var(--line);
      padding-bottom: 18px;
    }
    header small {
      color: var(--green);
      font-weight: 700;
    }
    h1 {
      font:
        500 clamp(28px, 4vw, 46px)/1.15 Georgia,
        serif;
      margin: 10px 0;
    }
    p {
      line-height: 1.5;
      margin: 8px 0;
    }
    .muted {
      color: var(--quiet);
      font-size: 14px;
    }
    .controls,
    .tools,
    .readout {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      align-items: center;
    }
    .controls {
      padding: 16px 0;
    }
    .controls label {
      display: grid;
      gap: 5px;
      font-size: 12px;
      font-weight: 650;
    }
    select,
    button,
    input {
      font: inherit;
    }
    select,
    button {
      padding: 7px 10px;
      border: 1px solid #adb8ae;
      background: white;
      color: var(--ink);
      border-radius: 5px;
    }
    button {
      cursor: pointer;
    }
    button[aria-pressed='true'] {
      background: var(--ink);
      color: white;
    }
    button:focus-visible,
    select:focus-visible,
    input:focus-visible {
      outline: 3px solid #bd8112;
      outline-offset: 2px;
    }
    .tools {
      font-size: 14px;
      margin: 0 0 12px;
    }
    .tools label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .tools input[type='range'] {
      width: 115px;
    }
    .panels {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .panels.overlay {
      grid-template-columns: 1fr;
    }
    figure {
      margin: 0;
      min-width: 0;
    }
    figcaption {
      padding: 6px 0;
      color: var(--quiet);
      font-size: 13px;
      font-weight: 650;
    }
    .stage {
      height: clamp(180px, 31vw, 336px);
      overflow: hidden;
      position: relative;
      background: #ebece5;
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    .layer {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: top left;
    }
    .layer img {
      width: 100%;
      height: 100%;
      display: block;
    }
    .guide {
      position: absolute;
      pointer-events: none;
    }
    .guide.x {
      height: 100%;
      top: 0;
      border-left: 1px dashed var(--green);
    }
    .guide.y {
      width: 100%;
      left: 0;
      border-top: 1px dashed var(--green);
    }
    .guide.to {
      border-color: var(--red);
      border-style: solid;
      border-width: 0;
    }
    .guide.x.to {
      border-left-width: 1px;
    }
    .guide.y.to {
      border-top-width: 1px;
    }
    .guide.relative {
      opacity: 0.8;
    }
    .guide.x.relative {
      height: 45%;
    }
    .guide.y.relative {
      width: 45%;
    }
    .readout {
      padding: 14px 0 4px;
      font-size: 15px;
    }
    details {
      margin: 12px 0;
      color: var(--quiet);
      font-size: 14px;
    }
    summary {
      cursor: pointer;
    }
    details ul {
      padding-left: 20px;
    }
    details li {
      margin: 5px 0;
    }
    .legend {
      font-size: 12px;
      color: var(--quiet);
    }
    .legend b {
      color: var(--green);
    }
    .legend strong {
      color: var(--red);
    }
    h2 {
      font:
        500 22px/1.3 Georgia,
        serif;
      margin: 20px 0 4px;
    }
    .table-scroll {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }
    th,
    td {
      text-align: left;
      padding: 9px 8px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }
    th {
      color: var(--quiet);
      font-size: 12px;
    }
    tbody button {
      background: transparent;
      border: 0;
      padding: 4px 0;
      font-weight: 600;
      text-align: left;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    tr.selected {
      background: #e7ede4;
    }
    .drift {
      color: var(--red);
      font-weight: 650;
    }
    .expected,
    .aligned {
      color: var(--green);
    }
    .unverified {
      color: #814c0c;
    }
    a {
      color: var(--green);
    }
    [hidden] {
      display: none !important;
    }
    @media (max-width: 600px) {
      main {
        padding-top: 18px;
      }
      .panels {
        grid-template-columns: 1fr;
      }
      .tools {
        gap: 8px 12px;
      }
      .stage {
        height: 185px;
      }
    }
  </style>
  <main>
    <header>
      <small>Eagle Eye / View comparison</small>
      <h1 id="title"></h1>
      <p id="summary" class="muted"></p>
    </header>
    <div class="controls">
      <label>Viewport<select id="profile"></select></label
      ><label>Compare views<select id="pair"></select></label>
    </div>
    <div class="tools">
      <button id="side" aria-pressed="true">Side by side</button
      ><button id="overlay" aria-pressed="false">Overlay</button> <button id="next">Next issue</button
      ><label id="blendControl" hidden
        >Blend <input id="blend" aria-label="Overlay blend" type="range" min="0" max="100" value="50"
      /></label>
      <label><input id="detail" type="checkbox" checked /> 2× detail</label
      ><label><input id="guides" type="checkbox" checked /> Guides</label>
    </div>
    <div id="panels" class="panels"></div>
    <p class="legend">
      <b>Dashed green</b> marks the source view. <strong>Solid red</strong> marks the destination. Short
      guides mark the relative anchor.
    </p>
    <div class="readout"><strong id="selectedLabel"></strong><span id="numbers"></span></div>
    <p id="note" class="muted" aria-live="polite"></p>
    <details>
      <summary>Computed spacing changes</summary>
      <ul id="styles"></ul>
    </details>
    <h2>Measurements</h2>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Check</th>
            <th>From</th>
            <th>To</th>
            <th>Change</th>
            <th>Intended</th>
            <th>Tolerance</th>
            <th>Result</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="muted"><a href="AUDIT.md">Audit log</a> · <a href="report.json">Measurement data</a></p>
  </main>

      position();
    }
    function position() {
      for (const { layer, stage, profile, focus, img, index } of layers) {
        const w = stage.clientWidth,
          h = stage.clientHeight;
        const s = el('detail').checked ? 2 : Math.min(w / profile.width, h / profile.height);
        function shift(size, full, center) {
          return full * s <= size
            ? (size - full * s) / 2
            : Math.max(size - full * s, Math.min(0, size / 2 - center * s));
        }
        layer.style.transform =
          'translate(' +
          shift(w, profile.width, focus[0]) +
          'px,' +
          shift(h, profile.height, focus[1]) +
          'px) scale(' +
          s +
          ')';
        img.style.opacity = overlaid && index === 1 ? Number(el('blend').value) / 100 : 1;
      }
    }
    el('profile').onchange = selectProfile;
    el('pair').onchange = selectPair;
    el('side').onclick = () => {
      overlaid = false;
      drawPanels();
    };
    el('overlay').onclick = () => {
      overlaid = true;
      drawPanels();
    };
    el('detail').onchange = position;
    el('guides').onchange = drawPanels;
    el('blend').oninput = position;
    window.addEventListener('resize', position);
    selectProfile();
  </script>
</html>
