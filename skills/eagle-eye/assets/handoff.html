<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title><!--TITLE--> · Eagle Eye</title>
  <style><!--STYLE--></style>
</head>
<body>
  <a class="skip" href="#overview">Skip to report</a>
  <header class="masthead">
    <div class="shell mast-inner">
      <a class="brand" href="#overview" aria-label="Eagle Eye, report overview"><span class="mark" aria-hidden="true"><i></i></span>Eagle Eye</a>
      <span class="mast-label">Audit handoff</span>
      <button class="present js-only" id="present" hidden><i aria-hidden="true"></i>Present</button>
    </div>
  </header>
  <nav class="index" aria-label="Report sections"><div class="shell"><!--NAV--></div></nav>
  <main class="shell"><!--SECTIONS--></main>
  <footer class="shell footer"><span>Eagle Eye</span><a href="#overview">Back to overview ↑</a></footer>
  <nav class="player" aria-label="Presentation controls" hidden>
    <div class="shell player-inner">
      <span id="progress" aria-live="polite"></span>
      <button id="previous" aria-label="Previous slide">← <span>Back</span></button>
      <button id="next" aria-label="Next slide"><span>Next</span> →</button>
      <button id="exit">Exit</button>
    </div>
  </nav>
  <script><!--SCRIPT--></script>
</body>
</html>
